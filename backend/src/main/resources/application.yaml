spring:
  application:
    name: payment-approval-backend

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${PAYMENT_ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${PAYMENT_ATTACHMENT_MAX_REQUEST_SIZE:12MB}

payment-approval:
  attachment:
    storage-root: ${PAYMENT_ATTACHMENT_STORAGE_ROOT:./data/attachments}
    max-file-size: ${PAYMENT_ATTACHMENT_MAX_FILE_SIZE:10MB}
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    allowed-extensions:
      - pdf
      - jpg
      - jpeg
      - png

server:
  port: 8080
